[Database]
dbms = duckdb
path = data/indexes/chicago_open.db
index_table = chicago_open

[Optimizer]
cost_basis = measured

[NLSeeker]
index_name = chicago_open
schema = nl_chicago_open
llm_base_url = http://localhost:8011/v1
llm_api_key = vllm-local
llm_model = Qwen3.5-9B
llm_temperature = 0.0
llm_max_new_tokens = 512
llm_context_length = 32768
llm_concurrency = 1
llm_retry_attempts = 5
llm_tokenizer = Qwen/Qwen3.5-9B
embedding_base_url = http://127.0.0.1:8002/v1
embedding_api_key = vllm-local
embedding_model = bge-base-en-v1.5
embedding_max_tokens = 512
embedding_batch_size = 256
embedding_tokenizer = BAAI/bge-base-en-v1.5
alpha = 0.5
n = 5

[Agent]
api_key = vllm-local
router_model = Qwen3.5-9B
router_base_url = http://localhost:8011/v1
router_thinking = true
router_thinking_budget = 2000
router_temperature = 0.7
decomposer_model = Qwen3.5-9B
decomposer_base_url = http://localhost:8011/v1
decomposer_thinking = true
decomposer_thinking_budget = 11000
decomposer_temperature = 1.0
filler_model = Qwen3.5-9B
filler_base_url = http://localhost:8011/v1
filler_thinking = true
filler_thinking_budget = 8000
filler_temperature = 1.0
edit_model = Qwen3.5-9B
edit_base_url = http://localhost:8011/v1
edit_thinking = true
edit_thinking_budget = 8000
edit_temperature = 0.7
chat_model = Qwen3.5-9B
chat_base_url = http://localhost:8011/v1
chat_thinking = false
chat_thinking_budget = 7000
chat_temperature = 0.7
verifier_model = Qwen3.5-9B
verifier_base_url = http://localhost:8011/v1
verifier_thinking = true
verifier_thinking_budget = 6000
verifier_temperature = 1.0
profiler_model = Qwen3.8-27B
profiler_base_url = http://localhost:8012/v1
profiler_thinking = false
profiler_thinking_budget = 3000
profiler_temperature = 0.0
samples = 3
k_default = 10
question_rounds = 5
clarification_rounds = 0
trigger_threshold = any_disagreement
fill_sides = false
verify = false
semantic_profile = true
open_at_once = 1
repair_rounds = 2
revision_rounds = 3
k_multiple = 10
nl_inner_cap = 50
exclusion_cap = 1000
sample_timeout = 450
profiler_concurrency = 32
prompt_token_limit = 18500
record_dir = logs/agent
profile_cache_dir = data/profiles
planner = text

