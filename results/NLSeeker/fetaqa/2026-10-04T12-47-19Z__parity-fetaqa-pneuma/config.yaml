run:
  tag: parity-fetaqa
  questions_limit: 1000
datasets:
- fetaqa
families:
- BC1
- BC2
- BX1
- BX2
retrieval:
  k:
  - 1
  - 5
  n:
  - 5
  alpha:
  - 0.5
  rerank:
  - true
  - false
attribution:
  k:
  - 1
  - 5
  alpha:
  - 0.0
  - 1.0
nlseeker:
  llm_api_key: vllm-local
  llm_model: Qwen2.5-7B-Instruct
  llm_temperature: 0.0
  llm_max_new_tokens: 512
  llm_context_length: 32768
  llm_concurrency: 1
  llm_retry_attempts: 5
  llm_tokenizer: Qwen/Qwen2.5-7B-Instruct
  embedding_api_key: vllm-local
  embedding_model: bge-base-en-v1.5
  embedding_max_tokens: 512
  embedding_batch_size: 256
  embedding_tokenizer: BAAI/bge-base-en-v1.5
backends:
  blend:
    llm_base_url: http://127.0.0.1:8001/v1
    embedding_base_url: http://127.0.0.1:8002/v1
  pneuma:
    llm_base_url: http://127.0.0.1:8003/v1
    embedding_base_url: http://127.0.0.1:8006/v1
