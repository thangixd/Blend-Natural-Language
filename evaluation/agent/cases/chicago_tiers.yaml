- gold_plan_id: chi-t1
  lake: chicago
  template: Data imputation (DataImputation)
  tier: tasks
  class: task
  query_table: data/Evaluation/NLSeeker/cache/lakes/chicago_10K/Lobbyist Data - Lobbyist Gift Report (Deprecated October 2015)_SEP_table_281.csv
  gold_plan:
    template: imputation
    root:
      id: c1
      kind: intersection
      inputs:
      - id: p1
        words: have the missing middle initials of my lobbyists, matched by last name
        fill:
          seeker: multi_column
          columns:
            value: [lobbyist last name, lobbyist middle initial]
            status: certain
          rows_where: {column: lobbyist middle initial, cell: value}
      - id: p2
        words: have the missing middle initials of my lobbyists, matched by last name
        fill:
          seeker: single_column
          column: {value: lobbyist last name, status: certain}
          rows_where: {column: lobbyist middle initial, cell: empty}
  cases:
    - id: chi-t1-L0
      level: 0
      rounds_needed: 0
      description: >-
        Matching lobbyists on their last names, which tables can fill in the middle initials my gift report is
        missing?
      open_fields: []
    - id: chi-t1-L1
      level: 1
      rounds_needed: 1
      description: >-
        Which tables share the last names of the lobbyists in my gift report? Several of them still lack a middle
        initial.
      open_fields:
        - part: c1
          field: task
          intended: imputation
          opened_as: ambiguous
          valid_values: [imputation, single_column_join]
          why_open: >-
            The request is a join on the last names; the missing initials stand beside it, so filling them or the
            plain join both fit.
    - id: chi-t1-inf
      level: inferable
      rounds_needed: 0
      description: >-
        Some cells in my gift report are still empty. Which tables could fill them if each lobbyist is matched by last
        name?
      open_fields: []
      inferable:
        part: t
        field: fill
        why: >-
          Only the lobbyists' middle initial has empty cells (18 of 61 rows); every other column is complete, so the
          table decides the column to fill.

