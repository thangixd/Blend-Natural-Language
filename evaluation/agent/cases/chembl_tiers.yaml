- gold_plan_id: cht-s3
  lake: chembl
  template: Multi-column join
  tier: simple
  class: seen
  query_table: data/Evaluation/NLSeeker/cache/lakes/chembl_10K/target dictionary_SEP_table_78.csv
  gold_plan:
    template: multi_column_join
    root:
      id: p1
      words: tables that list my target names together with the taxonomy number of their species, in the same row
      fill:
        seeker: multi_column
        columns:
          value: [pref_name, tax_id]
          status: certain
  cases:
    - id: cht-s3-L0
      level: 0
      rounds_needed: 0
      description: >-
        Which tables list my target names together with the taxonomy number of their species, in the same row?
      open_fields: []
    - id: cht-s3-L1
      level: 1
      rounds_needed: 1
      description: >-
        Which tables give each of my targets beside its species, in one row?
      open_fields:
        - part: p1
          field: columns
          intended: [pref_name, tax_id]
          opened_as: ambiguous
          valid_values: [[pref_name, organism], [pref_name, tax_id], [chembl_id, organism], [chembl_id, tax_id]]
          why_open: >-
            A target is named (Maltase-glucoamylase) and has a ChEMBL id (CHEMBL2074); its species is named (Homo
            sapiens) and has a taxonomy number (9606).
    - id: cht-s3-L2
      level: 2
      rounds_needed: 2
      description: >-
        Which tables have my targets and their species?
      open_fields:
        - part: p1
          field: part_count
          intended: 1
          opened_as: ambiguous
          valid_values: [1, 2]
          why_open: >-
            Targets with their species in one row, or a table that has my targets and, anywhere, my species.
        - part: p1
          field: columns
          intended: [pref_name, tax_id]
          opened_as: ambiguous
          valid_values: [[pref_name, organism], [pref_name, tax_id], [chembl_id, organism], [chembl_id, tax_id]]
          why_open: >-
            As in cht-s3-L1.

