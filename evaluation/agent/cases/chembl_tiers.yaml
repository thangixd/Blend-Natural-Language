- gold_plan_id: cht-t1
  lake: chembl
  template: Data imputation (DataImputation)
  tier: tasks
  class: task
  query_table: data/Evaluation/NLSeeker/cache/lakes/chembl_10K/molecule dictionary_SEP_table_54.csv
  gold_plan:
    template: imputation
    root:
      id: c1
      kind: intersection
      inputs:
      - id: p1
        words: hold the missing USAN years for my molecules, found by the molecule registry number
        fill:
          seeker: multi_column
          columns:
            value: [molregno, usan_year]
            status: certain
          rows_where: {column: usan_year, cell: value}
      - id: p2
        words: hold the missing USAN years for my molecules, found by the molecule registry number
        fill:
          seeker: single_column
          column: {value: molregno, status: certain}
          rows_where: {column: usan_year, cell: empty}
  cases:
    - id: cht-t1-L0
      level: 0
      rounds_needed: 0
      description: >-
        My molecule list lacks the USAN year for most entries. Which tables hold those years for my molecules? Use the
        molecule registry number to find each one.
      open_fields: []
    - id: cht-t1-L1
      level: 1
      rounds_needed: 1
      description: >-
        My molecule list has a lot of blank cells. Which tables hold what is missing? Use the molecule registry number
        to find each one.
      open_fields:
        - part: t
          field: fill
          intended: usan_year
          opened_as: ambiguous
          valid_values: [pref_name, max_phase, chebi_par_id, first_approval, usan_year, availability_type, usan_stem,
            usan_substem, usan_stem_definition, indication_class]
          why_open: >-
            Ten columns have empty cells (names, phases, years, stems, classes), and the words name none.
    - id: cht-t1-L2
      level: 2
      rounds_needed: 2
      description: >-
        My molecule list has a lot of blank cells. Which tables hold what is missing? Use each molecule's identifier
        to find it.
      open_fields:
        - part: t
          field: fill
          intended: usan_year
          opened_as: ambiguous
          valid_values: [pref_name, max_phase, chebi_par_id, first_approval, usan_year, availability_type, usan_stem,
            usan_substem, usan_stem_definition, indication_class]
          why_open: >-
            As in cht-t1-L1.
        - part: t
          field: key
          intended: molregno
          opened_as: ambiguous
          valid_values: [molregno, chembl_id]
          why_open: >-
            A molecule is identified by its registry number (1, 2, ...) and by its ChEMBL id (CHEMBL6329).
    - id: cht-t1-L3
      level: 3
      rounds_needed: 3
      description: >-
        Look for tables keyed on the same identifiers as my molecules; a lot of my cells are still blank.
      open_fields:
        - part: c1
          field: task
          intended: imputation
          opened_as: ambiguous
          valid_values: [imputation, single_column_join]
          why_open: >-
            The request asks for tables keyed on my identifiers; the blank cells are the reason to fill them through
            those tables, or only a remark beside the request.
        - part: t
          field: fill
          intended: usan_year
          opened_as: ambiguous
          valid_values: [pref_name, max_phase, chebi_par_id, first_approval, usan_year, availability_type, usan_stem,
            usan_substem, usan_stem_definition, indication_class]
          why_open: >-
            As in cht-t1-L1.
        - part: t
          field: key
          intended: molregno
          opened_as: ambiguous
          valid_values: [molregno, chembl_id]
          why_open: >-
            As in cht-t1-L2.

- gold_plan_id: cht-t2
  lake: chembl
  template: Augmentation by example (AugmentationByExample)
  tier: tasks
  class: task
  query_table: evaluation/agent/cases/chembl_tiers_formulations_examples.csv
  gold_plan:
    template: imputation
    root:
      id: c1
      kind: intersection
      inputs:
      - id: p1
        words: tell me the ingredient of the remaining rows, keyed on the molecule registry number
        fill:
          seeker: multi_column
          columns:
            value: [molregno, ingredient]
            status: certain
          rows_where: {column: ingredient, cell: value}
      - id: p2
        words: tell me the ingredient of the remaining rows, keyed on the molecule registry number
        fill:
          seeker: single_column
          column: {value: molregno, status: certain}
          rows_where: {column: ingredient, cell: empty}
  cases:
    - id: cht-t2-L0
      level: 0
      rounds_needed: 0
      description: >-
        Only five of my formulation rows name their ingredient so far. Which tables can tell me the ingredient of the
        remaining rows, keyed on the molecule registry number?
      open_fields: []
    - id: cht-t2-L1
      level: 1
      rounds_needed: 1
      description: >-
        Only five of my formulation rows name their ingredient so far. Which tables can tell me the ingredient of the
        remaining rows, through one of the identifiers my rows carry?
      open_fields:
        - part: t
          field: key
          intended: molregno
          opened_as: ambiguous
          valid_values: [product_id, record_id, molregno, formulation_id]
          why_open: >-
            Each row carries four identifiers: the product, the compound record, the molecule registry number and the
            formulation.
    - id: cht-t2-L2
      level: 2
      rounds_needed: 2
      description: >-
        Which tables are linked to my formulation rows through one of the identifiers they carry? So far only five
        rows name their ingredient.
      open_fields:
        - part: c1
          field: task
          intended: imputation
          opened_as: ambiguous
          valid_values: [imputation, single_column_join]
          why_open: >-
            The question asks for linked tables; the five typed ingredients are the reason to supply the rest through
            them, or only a remark beside the question.
        - part: t
          field: key
          intended: molregno
          opened_as: ambiguous
          valid_values: [product_id, record_id, molregno, formulation_id]
          why_open: >-
            As in cht-t2-L1.
    - id: cht-t2-L3
      level: 3
      rounds_needed: 3
      description: >-
        Which tables are linked to my formulation rows through one of the identifiers they carry? Not every cell of
        mine is filled in yet.
      open_fields:
        - part: c1
          field: task
          intended: imputation
          opened_as: ambiguous
          valid_values: [imputation, single_column_join]
          why_open: >-
            The question asks for linked tables; the unfilled cells are the reason to fill them through those tables,
            or only a remark beside the question.
        - part: t
          field: key
          intended: molregno
          opened_as: ambiguous
          valid_values: [product_id, record_id, molregno, formulation_id]
          why_open: >-
            As in cht-t2-L1.
        - part: t
          field: fill
          intended: ingredient
          opened_as: ambiguous
          valid_values: [ingredient, strength]
          why_open: >-
            Two columns have empty cells: the ingredient (all but five rows) and the strength (38 rows of the lake
            table).
    - id: cht-t2-inf
      level: inferable
      rounds_needed: 0
      description: >-
        Only five rows of my newest column are filled in so far. Which tables can tell me the value of the remaining
        rows, keyed on the molecule registry number?
      open_fields: []
      inferable:
        part: t
        field: fill
        why: >-
          Only the ingredient column has values in just five rows; the strength is filled in all but 38.

