- gold_plan_id: cht-s1
  lake: chembl
  template: Single-column join
  tier: simple
  class: seen
  query_table: data/Evaluation/NLSeeker/cache/lakes/chembl_10K/protein classification_SEP_table_22.csv
  gold_plan:
    template: single_column_join
    root:
      id: p1
      words: tables that contain my protein classes' short names
      fill:
        seeker: single_column
        column: {value: short_name, status: certain}
  cases:
    - id: cht-s1-L0
      level: 0
      rounds_needed: 0
      description: >-
        Which tables contain my protein classes' short names?
      open_fields: []
    - id: cht-s1-L1
      level: 1
      rounds_needed: 1
      description: >-
        Which tables contain my protein classes?
      open_fields:
        - part: p1
          field: column
          intended: short_name
          opened_as: ambiguous
          valid_values: [protein_class_id, pref_name, short_name, protein_class_desc]
          why_open: >-
            Each class is in the table four times: a number, a full name (Serine protease S8A subfamily), a short name
            (S8A) and a lower-case path (enzyme protease serine sb s8a).

