- gold_plan_id: awt-t1
  lake: adventure_works
  template: Data imputation (DataImputation)
  tier: tasks
  class: task
  query_table: data/Evaluation/NLSeeker/cache/lakes/adventure_works/BillOfMaterials_SEP_table_64.csv
  gold_plan:
    template: imputation
    root:
      id: c1
      kind: intersection
      inputs:
        - id: p1
          words: restore the empty assembly numbers from other tables, matching each row on its bill-of-materials number
          fill:
            seeker: multi_column
            columns: {value: [BillOfMaterialsID, ProductAssemblyID], status: certain}
            rows_where: {column: ProductAssemblyID, cell: value}
        - id: p2
          words: restore the empty assembly numbers from other tables, matching each row on its bill-of-materials number
          fill:
            seeker: single_column
            column: {value: BillOfMaterialsID, status: certain}
            rows_where: {column: ProductAssemblyID, cell: empty}
  cases:
    - id: awt-t1-L0
      level: 0
      rounds_needed: 0
      description: >-
        The assembly number is empty in some of my bill-of-materials rows. I'd like to restore it from other tables,
        matching each row on its bill-of-materials number.
      open_fields: []
    - id: awt-t1-L1
      level: 1
      rounds_needed: 1
      description: >-
        The assembly number is empty in some of my bill-of-materials rows. I'd like to restore it from other tables,
        matching each row on one of its ID numbers.
      open_fields:
        - part: t
          field: key
          intended: BillOfMaterialsID
          opened_as: ambiguous
          valid_values: [BillOfMaterialsID, ComponentID]
          why_open: Each row has two ID numbers to match on, its own and the number of the component it lists.
    - id: awt-t1-L2
      level: 2
      rounds_needed: 2
      description: >-
        Some cells of my bill-of-materials rows are empty. I'd like to restore them from other tables, matching each
        row on one of its ID numbers.
      open_fields:
        - part: t
          field: key
          intended: BillOfMaterialsID
          opened_as: ambiguous
          valid_values: [BillOfMaterialsID, ComponentID]
          why_open: As in awt-t1-L1.
        - part: t
          field: fill
          intended: ProductAssemblyID
          opened_as: ambiguous
          valid_values: [ProductAssemblyID, EndDate]
          why_open: Two columns have empty cells, the assembly number (103 rows) and the end date (2,480 rows).
    - id: awt-t1-L3
      level: 3
      rounds_needed: 3
      description: >-
        My bill-of-materials rows are blank in places. Which tables can be matched to them on one of their ID numbers?
      open_fields:
        - part: c1
          field: task
          intended: imputation
          opened_as: ambiguous
          valid_values: [imputation, single_column_join]
          why_open: >-
            The question asks for tables that match my rows on an ID number (a join), and the empty cells beside it may
            be what the match is for (filling them in).
        - part: t
          field: key
          intended: BillOfMaterialsID
          opened_as: ambiguous
          valid_values: [BillOfMaterialsID, ComponentID]
          why_open: As in awt-t1-L1.
        - part: t
          field: fill
          intended: ProductAssemblyID
          opened_as: ambiguous
          valid_values: [ProductAssemblyID, EndDate]
          why_open: As in awt-t1-L2.

